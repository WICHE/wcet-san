name: 'WCET SAN'
type: theme
description: 'Clean, custom Drupal 11 theme for the WCET State Authorization Network. Build-less (CSS custom properties); art-direct the whole look from css/tokens.css.'
core_version_requirement: ^10.3 || ^11
# Built on stable9 — core's clean, minimal, stable-markup base theme.
# Deliberately NOT classy: no extra wrapper classes, clean semantic output.
base theme: stable9
# Screenshot shown on the Appearance page (add screenshot.png when a design lands).

libraries:
  - wiche/global

# Block regions. Machine names mirror the old themekit theme so existing block
# placements can be re-created 1:1 when we switch the default theme over.
regions:
  utility: 'Utility bar'
  header: Header
  primary_menu: 'Primary menu'
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  featured: Featured
  help: Help
  page_top: 'Page top'
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer_top: 'Footer (light)'
  footer: 'Footer (WCET dark band)'
  page_bottom: 'Page bottom'
