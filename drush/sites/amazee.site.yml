# Lagoon / amazee.io Drush site aliases.
#
# The SSH host + port are taken from the Lagoon-injected env vars
# (LAGOON_CONFIG_SSH_HOST / LAGOON_CONFIG_SSH_PORT) rather than hardcoded, so
# cross-environment drush works from inside a pod — where the reachable endpoint
# and port differ from the public portal (e.g. port 22, not 32222). Drush
# interpolates ${env.*} in alias files. These aliases are intended to run from
# within a Lagoon environment (where those vars are set).
#
# Aliases: @amazee.master (prod), @amazee.dev.
dev:
  host: ${env.LAGOON_CONFIG_SSH_HOST}
  options:
    backup-dir: /tmp
    command-specific:
      sql-sync:
        no-ordered-dump: true
  root: /app/docroot
  user: wcetsan-wiche-edu-develop
  ssh:
    options: '-o LogLevel=ERROR -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p ${env.LAGOON_CONFIG_SSH_PORT}'
master:
  host: ${env.LAGOON_CONFIG_SSH_HOST}
  options:
    backup-dir: /tmp
    command-specific:
      sql-sync:
        no-ordered-dump: true
  root: /app/docroot
  user: wcetsan-wiche-edu-master
  ssh:
    options: '-o LogLevel=ERROR -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p ${env.LAGOON_CONFIG_SSH_PORT}'
