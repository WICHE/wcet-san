dev:
  host: ssh.us2.amazee.io
  options:
    backup-dir: /tmp
    command-specific:
      sql-sync:
        no-ordered-dump: true
  root: /app/docroot
  user: wcetsan-wiche-edu-develop
  ssh:
    options: '-o LogLevel=ERROR -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p 32222'
